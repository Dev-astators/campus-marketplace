name: Release Artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing release tag (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build_and_upload_assets:
    runs-on: ubuntu-latest
    name: Build and Upload Release Assets
    env:
      TAG_NAME: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Build client
        working-directory: client
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Package client artifact
        run: |
          cd client/dist
          zip -r ../../client-dist-${{ env.TAG_NAME }}.zip .

      - name: Install server dependencies
        working-directory: server
        run: npm install --omit=dev

      - name: Package server artifact
        run: |
          cd server
          zip -r ../server-${{ env.TAG_NAME }}.zip . \
            --exclude "*.test.*" \
            --exclude "*.spec.*" \
            --exclude ".env*"

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: |
            client-dist-${{ env.TAG_NAME }}.zip
            server-${{ env.TAG_NAME }}.zip
          fail_on_unmatched_files: true
          overwrite_files: true
